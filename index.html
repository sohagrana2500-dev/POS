function toast(msg, isErr){
  const el = document.createElement("div");
  el.textContent = msg;

/* ======================= AUTH / BOOTSTRAP ======================= */
async function checkSuperAdminExists(){
  const { data, error } = await sb.rpc("setup_done");
  if(error) return false;
  return !!data;
}
async function loadSession(){
  const { data:{ session } } = await sb.auth.getSession();
  SESSION = session;
  if(!session){ PROFILE=null; SHOP=null; return; }
  const { data: profile } = await sb.from("profiles").select("*").eq("id",session.user.id).single();
  PROFILE = profile;
  if(profile && profile.shop_id){
    const { data: shop } = await sb.from("shops").select("*").eq("id",profile.shop_id).single();
    SHOP = shop;
  } else SHOP = null;
}
sb.auth.onAuthStateChange(async (_e, session) => { SESSION = session; await render(); });

async function callFn(action, payload){
  const { data, error } = await sb.functions.invoke("admin-actions", { body: { action, ...payload } });
  if(error){ throw new Error(error.message || t("error")); }
  if(data && data.error) throw new Error(data.error);
  return data;
}

  return `<button onclick="setLang()" class="text-xs font-semibold px-2.5 py-1 rounded-full border border-slate-300 bg-white">${LANG==="bn"?"EN":"বাং"}</button>`;
}
function setLang(){ LANG = LANG==="bn"?"en":"bn"; localStorage.setItem("lang",LANG); render(); }

function navItems(){
  if(!PROFILE) return [];
  if(PROFILE.role === "super_admin") return [["/admin", t("admin"), "🛡️"]];
  const items = [["/dashboard", t("dashboard"), "🏠"], ["/pos", t("pos"), "🧾"], ["/products", t("stock"), "📦"], ["/customers", t("customers"), "👥"], ["/sales", t("sales"), "🗂️"]];
  if(PROFILE.role === "owner"){ items.push(["/reports", t("reports"), "📊"]); items.push(["/staff", t("staff"), "👔"]); }

}

          <span class="text-lg leading-none">${icon}</span><span class="whitespace-nowrap">${label}</span>

async function doLogin(e){

  const email = document.getElementById("li-email").value, password = document.getElementById("li-pass").value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error) return toast(error.message, true);
  await loadSession();
  nav(PROFILE?.role === "super_admin" ? "/admin" : "/dashboard");
  render();
}
function setupView(){
  return `
  <div class="max-w-sm mx-auto mt-16 bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
    <h1 class="text-lg font-bold text-center mb-4">${t("setupTitle")}</h1>

      <div><label class="text-xs font-medium text-slate-600">${t("yourName")}</label>
        <input required id="su-name" class="w-full mt-1 px-3 py-2 rounded-lg border border-slate-300"/></div>

async function doSetupReal(e){
  e.preventDefault();
  const name = document.getElementById("su-name").value, email = document.getElementById("su-email").value, password = document.getElementById("su-pass").value;

    await callFn("bootstrap_super_admin", { name, email, password });

}
window.doSetup = doSetupReal;

/* ======================= DASHBOARD ======================= */
async function dashboardView(){
  if(PROFILE.role === "super_admin"){ nav("/admin"); return ""; }
  if(SHOP && !SHOP.is_active) return `<p class="bg-white rounded-xl p-5 text-sm">${t("shopInactive")}</p>`;
  const today = ymd(new Date());
  const { start, end } = rangeISO(today, today);
  const { data: todaySales } = await sb.from("sales").select("total").gte("created_at",start).lt("created_at",end);
  const todayTotal = (todaySales||[]).reduce((a,s)=>a+Number(s.total),0);
  const { data: dueCustomers } = await sb.from("customers").select("due_amount").gt("due_amount",0);
  const totalDue = (dueCustomers||[]).reduce((a,c)=>a+Number(c.due_amount),0);
  const { data: lowStock } = await sb.from("products").select("id,name,stock_qty,low_stock_level");
  const low = (lowStock||[]).filter(p=>Number(p.stock_qty)<=Number(p.low_stock_level));
  return `
  <div class="grid grid-cols-2 gap-3">
    <div class="bg-white rounded-xl p-4 border border-slate-200"><p class="text-xs text-slate-500">${t("total")} (${t("dashboard")})</p><p class="text-xl font-bold num">${fmt(todayTotal)}</p></div>
    <div class="bg-white rounded-xl p-4 border border-slate-200"><p class="text-xs text-slate-500">${t("due")}</p><p class="text-xl font-bold num text-red-600">${fmt(totalDue)}</p></div>
  </div>
  <div class="bg-white rounded-xl p-4 border border-slate-200 mt-3">
    <p class="text-sm font-semibold mb-2">⚠️ Low stock</p>
    ${low.length===0? `<p class="text-sm text-slate-400">${t("noData")}</p>` : `<ul class="text-sm divide-y divide-slate-100">${low.map(p=>`<li class="py-1.5 flex justify-between"><span>${p.name}</span><span class="num text-red-600 font-semibold">${Number(p.stock_qty)}</span></li>`).join("")}</ul>`}
  </div>
  <div class="grid grid-cols-2 gap-3 mt-3">
    <button onclick="nav('/pos')" class="bg-emerald-600 text-white rounded-xl py-4 font-semibold">🧾 ${t("pos")}</button>
    <button onclick="nav('/customers')" class="bg-white border border-slate-200 rounded-xl py-4 font-semibold">👥 ${t("customers")}</button>
  </div>`;
}
function ymd(d){ const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function rangeISO(from,to){ const s=new Date(from+"T00:00:00"), e=new Date(to+"T00:00:00"); e.setDate(e.getDate()+1); return {start:s.toISOString(), end:e.toISOString()}; }

/* ======================= POS ======================= */
let CART = [];
async function posView(){
  const { data: products } = await sb.from("products").select("id,name,sku,sell_price,stock_qty").order("name");
  window.__PRODUCTS = products||[];
  return `
  <div class="grid md:grid-cols-[1fr_340px] gap-4">
    <div>
      <input id="pos-q" oninput="renderProductGrid()" onkeydown="if(event.key==='Enter'){addFirstMatch()}" placeholder="${t('searchProduct')}" class="w-full px-3 py-3 rounded-lg border border-slate-300 mb-3" autofocus/>
      <div id="pos-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-2"></div>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-4 space-y-3 h-fit">
      <h2 class="font-semibold">${t('cart')} <span class="text-xs text-slate-400 num">(${CART.length})</span></h2>
      <div id="pos-cart"></div>
      <div>
        <label class="text-xs font-medium text-slate-600">${t('customer')}</label>
        <div id="pos-customer"></div>
      </div>
      <div id="pos-totals" class="space-y-1.5 text-sm num"></div>
      <button onclick="completeSale()" class="w-full bg-emerald-600 text-white font-semibold py-3 rounded-lg">${t('completeSale')}</button>
    </div>
  </div>`;
}
let POS_CUSTOMER = null;
function renderProductGrid(){
  const q = (document.getElementById("pos-q")?.value||"").toLowerCase().trim();
  let list = window.__PRODUCTS||[];
  list = q ? list.filter(p=>p.name.toLowerCase().includes(q) || (p.sku||"").toLowerCase().includes(q)) : list.slice(0,12);
  document.getElementById("pos-grid").innerHTML = list.map(p=>{
    const out = Number(p.stock_qty)<=0;
    return `<button ${out?"disabled":""} onclick="addToCart('${p.id}')" class="bg-white border border-slate-200 rounded-xl p-3 text-left ${out?"opacity-40":""}">
      <p class="text-sm font-medium line-clamp-2">${p.name}</p>
      <p class="num font-bold text-emerald-700 mt-1">${fmt(p.sell_price)}</p>
      <p class="num text-xs text-slate-400">${out?t('outOfStock'):(t('stock')+': '+Number(p.stock_qty))}</p></button>`;
  }).join("") || `<p class="text-sm text-slate-400 col-span-3">${t('noData')}</p>`;
}
function addFirstMatch(){
  const q = (document.getElementById("pos-q")?.value||"").toLowerCase().trim();
  const list = (window.__PRODUCTS||[]).filter(p=>p.name.toLowerCase().includes(q) || (p.sku||"").toLowerCase().includes(q));
  if(list[0]){ addToCart(list[0].id); document.getElementById("pos-q").value=""; renderProductGrid(); }
}
function addToCart(id){
  const p = (window.__PRODUCTS||[]).find(x=>x.id===id); if(!p) return;
  const line = CART.find(l=>l.p.id===id);
  const nextQty = (line?line.qty:0)+1;
  if(nextQty > Number(p.stock_qty)) return toast(t('notEnoughStock'), true);
  if(line) line.qty = nextQty; else CART.push({p, qty:1});
  renderCart();
}
function setQty(id, qty){
  const line = CART.find(l=>l.p.id===id); if(!line) return;
  if(qty > Number(line.p.stock_qty)) return toast(t('notEnoughStock'), true);
  if(qty<=0) CART = CART.filter(l=>l.p.id!==id); else line.qty = qty;
  renderCart();
}
function cartTotals(){
  const subtotal = CART.reduce((s,l)=>s+l.qty*Number(l.p.sell_price),0);
  const discount = Math.min(Math.max(Number(document.getElementById("pos-discount")?.value||0),0), subtotal);
  const grand = subtotal - discount;
  const paidInput = document.getElementById("pos-paid")?.value;
  const paid = paidInput===""||paidInput===undefined ? grand : Math.max(Number(paidInput)||0,0);
  const due = Math.max(grand-paid,0), change = Math.max(paid-grand,0);
  return {subtotal,discount,grand,paid,due,change};
}
function renderCart(){
  document.getElementById("pos-cart").innerHTML = CART.length===0 ? `<p class="text-sm text-slate-400">${t('emptyCart')}</p>` :
    `<ul class="divide-y divide-slate-100">${CART.map(l=>`
      <li class="py-2 flex items-center gap-2">

  const { data } = await sb.from("customers").select("id,name,phone,due_amount").ilike("name",`%${q}%`).limit(6);

function pickCustomer(id,name){ POS_CUSTOMER = {id,name}; renderCart(); }
function renderTotals(){
  const {subtotal,discount,grand,due,change} = cartTotals();
  document.getElementById("pos-totals").innerHTML = `
    <div class="flex justify-between"><span>${t('subtotal')}</span><span>${fmt(subtotal)}</span></div>

    <div class="flex justify-between font-bold text-base"><span>${t('grandTotal')}</span><span>${fmt(grand)}</span></div>
    <div class="flex justify-between items-center gap-2"><span>${t('paid')}</span><input id="pos-paid" type="number" placeholder="${grand}" oninput="renderTotals()" class="w-24 text-right px-2 py-1 border border-slate-300 rounded"/></div>
    <div class="flex justify-between text-red-600"><span>${t('due')}</span><span>${fmt(due)}</span></div>
    ${change>0?`<div class="flex justify-between text-slate-500"><span>${t('change')}</span><span>${fmt(change)}</span></div>`:""}`;

async function completeSale(){
  if(CART.length===0) return;
  const {discount,grand,paid,due} = cartTotals();
  if(due>0 && !POS_CUSTOMER) return toast(t('dueNeedsCustomer'), true);
  try{
    const { data: sale, error } = await sb.from("sales").insert({ shop_id: PROFILE.shop_id, customer_id: POS_CUSTOMER?.id||null, created_by: PROFILE.id, total: grand, discount, paid: Math.min(paid,grand), due }).select("id").single();
    if(error) throw error;
    const { error: iErr } = await sb.from("sale_items").insert(CART.map(l=>({ sale_id: sale.id, product_id: l.p.id, qty: l.qty, unit_price: l.p.sell_price, subtotal: l.qty*l.p.sell_price })));
    if(iErr) throw iErr;
    toast(t('saleDone'));
    CART = []; POS_CUSTOMER = null;
    nav('/receipt/'+sale.id);
  }catch(e){ toast(e.message||t('error'), true); }
}

async function adjustStock(id, dir){
  const n = prompt(t('stockQty'), "1"); if(n===null) return;

  const next = Math.max(0, Number(p.stock_qty) + dir*(Number(n)||0));
  const { error } = await sb.from("products").update({ stock_qty: next }).eq("id", id);
  if(error) return toast(error.message, true);
  toast(t('stockUpdated')); render();
}

/* ======================= REPORTS ======================= */
async function reportsView(){
  if(PROFILE.role !== "owner") return `<p class="bg-white rounded-xl p-5 text-sm">${t('noAccess')}</p>`;
  const now = new Date();
  const from0 = ymd(new Date(now.getFullYear(),now.getMonth(),1)), to0 = ymd(now);
  setTimeout(()=>renderReport(),0);
  return `
  <h1 class="text-lg font-bold mb-3">${t('profitLoss')}</h1>
  <div class="bg-white border border-slate-200 rounded-xl p-3 grid grid-cols-2 gap-3 mb-3">
    <div><label class="text-xs text-slate-500">${t('from')}</label><input id="r-from" type="date" value="${from0}" onchange="renderReport()" class="w-full px-2 py-1.5 border border-slate-300 rounded-lg"/></div>
    <div><label class="text-xs text-slate-500">${t('to')}</label><input id="r-to" type="date" value="${to0}" onchange="renderReport()" class="w-full px-2 py-1.5 border border-slate-300 rounded-lg"/></div>
  </div>
  <div id="report-grid" class="grid grid-cols-2 gap-3"></div>`;
}
async function renderReport(){
  const from = document.getElementById("r-from").value, to = document.getElementById("r-to").value;
  const { start, end } = rangeISO(from,to);
  const { data } = await sb.rpc("profit_report", { _from: start, _to: end });
  const r = (data && data[0]) || {};
  const profit = Number(r.profit||0);
  const stat = (l,v,cls="") => `<div class="bg-white border border-slate-200 rounded-xl p-4"><p class="text-xs text-slate-500">${l}</p><p class="num text-xl font-bold ${cls}">${v}</p></div>`;
  document.getElementById("report-grid").innerHTML =
    stat(t('total'), fmt(r.total_sales||0)) + stat(t('totalCost'), fmt(r.total_cost||0)) +
    stat(profit>=0?t('profit'):t('loss'), fmt(Math.abs(profit)), profit>=0?"text-emerald-700":"text-red-600") +
    stat(t('billCount'), String(r.sale_count||0)) + stat(t('totalDiscount'), fmt(r.total_discount||0));
}

async function staffView(){
  if(PROFILE.role !== "owner") return `<p class="bg-white rounded-xl p-5 text-sm">${t('noAccess')}</p>`;
  const { data } = await sb.from("profiles").select("id,name,is_active").eq("shop_id",PROFILE.shop_id).eq("role","employee").order("name");
  window.__STAFF = data||[];
  return `
  <div class="flex justify-between items-center mb-3"><h1 class="text-lg font-bold">${t('staff')}</h1>
    <button onclick="openStaffForm()" class="bg-emerald-600 text-white text-sm font-semibold px-3 py-2 rounded-lg">+ ${t('addEmployee')}</button></div>
  <ul class="space-y-2">${(window.__STAFF||[]).map(s=>`
    <li class="bg-white border border-slate-200 rounded-xl p-3 flex items-center justify-between">
      <div><p class="font-medium">${s.name}</p><p class="text-xs text-slate-400">${s.is_active?t('active'):t('inactive')}</p></div>
      <button onclick="toggleStaff('${s.id}',${!s.is_active})" class="text-xs px-2 py-1 border border-slate-300 rounded-full">${s.is_active?t('inactive'):t('active')}</button>
    </li>`).join("") || `<p class="text-sm text-slate-400">${t('noData')}</p>`}</ul>
  <div id="modal"></div>`;
}
async function toggleStaff(id, val){
  const { error } = await sb.from("profiles").update({ is_active: val }).eq("id", id);
  if(error) return toast(error.message, true);
  render();
}
function openStaffForm(){
  document.getElementById("modal").innerHTML = `
  <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-30 p-3">
    <div class="bg-white rounded-xl p-5 w-full max-w-sm space-y-3">
      <h2 class="font-bold">${t('addEmployee')}</h2>
      <form onsubmit="submitStaff(event)" class="space-y-2">
        <input required id="ef-name" placeholder="${t('name')}" class="w-full px-3 py-2 border border-slate-300 rounded-lg"/>
        <input required type="email" id="ef-email" placeholder="${t('email')}" class="w-full px-3 py-2 border border-slate-300 rounded-lg"/>
        <input required minlength="6" type="password" id="ef-pass" placeholder="${t('password')}" class="w-full px-3 py-2 border border-slate-300 rounded-lg"/>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="document.getElementById('modal').innerHTML=''" class="px-3 py-2 border border-slate-300 rounded-lg text-sm">${t('cancel')}</button>
          <button class="px-3 py-2 bg-emerald-600 text-white rounded-lg text-sm">${t('save')}</button>
        </div>
      </form>
    </div>
  </div>`;
}
async function submitStaff(e){
  e.preventDefault();
  try{
    await callFn("create_employee", { name: document.getElementById("ef-name").value, email: document.getElementById("ef-email").value, password: document.getElementById("ef-pass").value });
    toast(t('employeeCreated')); document.getElementById("modal").innerHTML=""; render();
  }catch(err){ toast(err.message,true); }
}

/* ======================= SUPER ADMIN ======================= */
async function adminView(){
  if(PROFILE.role !== "super_admin") return `<p class="bg-white rounded-xl p-5 text-sm">${t('noAccess')}</p>`;
  const { data } = await sb.from("shops").select("id,name,address,phone,is_active,created_at").order("created_at",{ascending:false});
  window.__SHOPS = data||[];
  return `
  <div class="flex justify-between items-center mb-3"><h1 class="text-lg font-bold">${t('admin')} · ${t('shops')}</h1>
    <button onclick="openShopForm()" class="bg-emerald-600 text-white text-sm font-semibold px-3 py-2 rounded-lg">+ ${t('addShop')}</button></div>
  <ul class="space-y-2">${(window.__SHOPS||[]).map(s=>`
    <li class="bg-white border border-slate-200 rounded-xl p-3 flex items-center justify-between gap-3">
      <div class="min-w-0"><p class="font-medium truncate">${s.name}</p><p class="text-xs text-slate-400 truncate">${[s.address,s.phone].filter(Boolean).join(' · ')}</p>
        <p class="text-xs ${s.is_active?'text-emerald-700':'text-red-600'}">${s.is_active?t('active'):t('inactive')}</p></div>
      <button onclick="toggleShop('${s.id}',${!s.is_active})" class="text-xs px-2 py-1 border border-slate-300 rounded-full">${s.is_active?t('inactive'):t('active')}</button>
    </li>`).join("") || `<p class="text-sm text-slate-400">${t('noData')}</p>`}</ul>
  <div id="modal"></div>`;
}
async function toggleShop(id,val){
  const { error } = await sb.from("shops").update({ is_active: val }).eq("id", id);
  if(error) return toast(error.message, true);
  render();
}
function openShopForm(){
  document.getElementById("modal").innerHTML = `
  <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-30 p-3">
    <div class="bg-white rounded-xl p-5 w-full max-w-sm space-y-2 max-h-[85vh] overflow-auto">
      <h2 class="font-bold">${t('addShop')}</h2>
      <form onsubmit="submitShop(event)" class="space-y-2">
        <input required id="sf-shopname" placeholder="${t('shopName')}" class="w-full px-3 py-2 border border-slate-300 rounded-lg"/>
        <input id="sf-address" placeholder="${t('address')}" class="w-full px-3 py-2 border border-slate-300 rounded-lg"/>
        <input id="sf-phone" placeholder="${t('phone')}" class="w-full px-3 py-2 border border-slate-300 rounded-lg"/>
        <input required id="sf-ownername" placeholder="${t('ownerName')}" class="w-full px-3 py-2 border border-slate-300 rounded-lg"/>
        <input required type="email" id="sf-owneremail" placeholder="${t('ownerEmail')}" class="w-full px-3 py-2 border border-slate-300 rounded-lg"/>
        <input required minlength="6" type="password" id="sf-ownerpass" placeholder="${t('ownerPassword')}" class="w-full px-3 py-2 border border-slate-300 rounded-lg"/>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="document.getElementById('modal').innerHTML=''" class="px-3 py-2 border border-slate-300 rounded-lg text-sm">${t('cancel')}</button>
          <button class="px-3 py-2 bg-emerald-600 text-white rounded-lg text-sm">${t('save')}</button>
        </div>
      </form>
    </div>
  </div>`;
}
async function submitShop(e){
  e.preventDefault();
  try{
    await callFn("create_shop_owner", { shopName: document.getElementById("sf-shopname").value, address: document.getElementById("sf-address").value, phone: document.getElementById("sf-phone").value,
      ownerName: document.getElementById("sf-ownername").value, ownerEmail: document.getElementById("sf-owneremail").value, ownerPassword: document.getElementById("sf-ownerpass").value });
    toast(t('shopCreated')); document.getElementById("modal").innerHTML=""; render();
  }catch(err){ toast(err.message, true); }
}

/* ======================= ROUTER ======================= */
async function render(){
  if(!SESSION){
    const hasAdmin = await checkSuperAdminExists();
    app.innerHTML = layout(!hasAdmin ? setupView() : loginView());
    return;
  }
  if(!PROFILE) await loadSession();
  if(!PROFILE){ app.innerHTML = layout(loginView()); return; }
  app.innerHTML = layout(`<p class="text-sm text-slate-400">${t('loading')}</p>`);
  let html = "";
  if(ROUTE.startsWith("/receipt/")) html = await receiptView(ROUTE.split("/")[2]);
  else if(ROUTE === "/pos") { html = await posView(); }
  else if(ROUTE === "/products") html = await productsView();
  else if(ROUTE === "/customers") html = await customersView();
  else if(ROUTE === "/sales") html = await salesView();
  else if(ROUTE === "/reports") html = await reportsView();
  else if(ROUTE === "/staff") html = await staffView();
  else if(ROUTE === "/admin") html = await adminView();
  else html = await dashboardView();
  app.innerHTML = layout(html);
  if(ROUTE === "/pos"){ renderProductGrid(); renderCart(); }
  if(ROUTE === "/products") renderProductList();
  if(ROUTE === "/customers") renderCustList();
  if(ROUTE === "/sales") renderSalesList();
}

/* ======================= INIT ======================= */
window.nav = nav; window.setLang = setLang; window.doLogin = doLogin; window.doLogout = doLogout;
window.addToCart = addToCart; window.setQty = setQty; window.renderProductGrid = renderProductGrid; window.addFirstMatch = addFirstMatch;
window.renderCustPick = renderCustPick; window.pickCustomer = pickCustomer; window.renderTotals = renderTotals; window.completeSale = completeSale;
window.openProductForm = openProductForm; window.saveProduct = saveProduct; window.adjustStock = adjustStock; window.deleteProduct = deleteProduct; window.renderProductList = renderProductList;
window.openCustomerForm = openCustomerForm; window.saveCustomer = saveCustomer; window.openCustomerDetail = openCustomerDetail; window.collectDue = collectDue; window.renderCustList = renderCustList;
window.renderSalesList = renderSalesList; window.renderReport = renderReport;
window.openStaffForm = openStaffForm; window.submitStaff = submitStaff; window.toggleStaff = toggleStaff;
window.openShopForm = openShopForm; window.submitShop = submitShop; window.toggleShop = toggleShop;

(async () => { await loadSession(); await render(); })();
</script>
